name: yixue_app
description: "Windows desktop translation, learning, and AI simultaneous interpretation software."
publish_to: 'none'
version: 0.1.0+8

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.0.7
  crypto: ^3.0.7
  desktop_multi_window: ^0.3.1
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  hotkey_manager: ^0.2.3
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  speech_to_text: ^7.5.0
  tray_manager: ^0.7.0
  sherpa_onnx: 1.13.8
  just_screenshot:
    path: ../../third_party/just_screenshot
  screen_retriever: ^0.2.2
  xml: ^6.6.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  hotkey_manager_windows:
    path: ../../third_party/hotkey_manager_windows

flutter:
  uses-material-design: true
  assets:
    - assets/brand/yixue-logo-master-v3.png
